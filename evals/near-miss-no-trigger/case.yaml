schema_version: "1.1"
name: near-miss-no-trigger
runs: 3
execution:
  prompt: Draft a cold email to a prospect about our product.
  max_turns: 12
  allowed_tools: [Skill]
graders:
  - name: skill-not-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analyzing-win-loss"'
    min: 0
    max: 0
