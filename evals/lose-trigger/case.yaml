schema_version: "1.1"
name: lose-trigger
runs: 3
execution:
  prompt: Why did we lose deals last quarter?
  max_turns: 12
  allowed_tools: [Skill, Read]
graders:
  - name: skill-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analyzing-win-loss"'
  - name: starts-with-get-programs
    type: regex
    target: mock_calls
    arm: both
    pattern: "^(?![\\s\\S]*\"tool\":\"mcp__plugin_clozd_clozd__get_organizations\")\\{\"tool\":\"mcp__plugin_clozd_clozd__get_programs\",\"input\":\\{\\},\"output\":"
