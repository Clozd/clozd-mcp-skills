schema_version: "1.1"
name: lose-trigger
runs: 3
execution:
  prompt: Why did we lose deals last quarter?
  max_turns: 12
  allowed_tools: [Skill]
graders:
  - name: skill-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?analyzing-win-loss"'
  - name: starts-with-get-programs
    type: llm
    focus: mock_calls
    criteria: |
      This mock connection is organization-scoped.
      PASS only if the first Clozd call listed is get_programs with empty
      arguments, and no get_organizations call is attempted.
      FAIL if organizationId or any unsupported argument is supplied, any other
      Clozd call comes first, or no Clozd call was made.
