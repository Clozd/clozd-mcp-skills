schema_version: "1.1"
name: consultancy-known-organization
runs: 3
execution:
  prompt: >
    Use the analyzing-win-loss skill to prepare a win-loss analysis. I am a
    consultancy user and the target organization ID is
    11111111-1111-4111-8111-111111111111. Start by listing its programs only.
  max_turns: 12
  allowed_tools: [Skill, Read]
graders:
  - name: uses-supplied-organization
    type: llm
    focus: mock_calls
    arm: both
    criteria: |
      PASS only if the first Clozd call is get_programs with organizationId
      11111111-1111-4111-8111-111111111111 and no get_organizations call occurs.
      FAIL if the organizationId is omitted, changed, or discovery is called.
  - name: no-redundant-confirmation
    type: llm
    criteria: |
      PASS only if the assistant lists the returned program without asking the
      user to select or confirm the already supplied organization.
