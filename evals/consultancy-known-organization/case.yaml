schema_version: "1.1"
name: consultancy-known-organization
runs: 3
execution:
  prompt: >
    Use the analyzing-win-loss skill to prepare a win-loss analysis. I am a
    consultancy user and the target organization ID is
    11111111-1111-4111-8111-111111111111. Start by listing its programs only.
  max_turns: 12
  allowed_tools: [Skill, Read]
graders:
  - name: uses-supplied-organization
    type: regex
    target: mock_calls
    arm: both
    pattern: "^\\{\"tool\":\"mcp__plugin_clozd_clozd__get_programs\",\"input\":\\{\"organizationId\":\"11111111-1111-4111-8111-111111111111\"\\},\"output\":[^\\n]+\\}\\s*$"
  - name: no-redundant-confirmation
    type: llm
    criteria: |
      PASS only if the assistant lists the returned program without asking the
      user to select or confirm the already supplied organization.
      Judge organization confirmation only. Offering a next analysis, asking
      which win/loss question or date range to use, or noting that only one
      program exists is not an organization-selection or confirmation request.
      Do not require any particular format for the program listing.
