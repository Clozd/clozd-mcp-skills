schema_version: "1.1"
name: consultancy-ambiguous-organization
runs: 3
execution:
  prompt: >
    Use the analyzing-win-loss skill to prepare a win-loss analysis. I am a
    consultancy user but have not picked an organization. Help me choose
    before you list programs.
  max_turns: 12
  allowed_tools: [Skill]
graders:
  - name: discovers-before-programs
    type: llm
    focus: mock_calls
    criteria: |
      PASS only if get_organizations is called with empty arguments and
      get_programs is not called before the user selects an organization.
      FAIL if an organization is guessed or get_programs is called without
      organizationId.
  - name: asks-for-selection
    type: llm
    criteria: |
      PASS only if the assistant asks for the organization name without
      choosing on the user's behalf or listing all organization names.
