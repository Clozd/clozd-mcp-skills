name: cut-release

# Manual: validate main, create the GitHub release, then build and attach the ZIPs.
# The release is created with GITHUB_TOKEN, which does not trigger release.yml,
# so the publish job calls it directly.

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Release candidate number (for example 1 gives v<version>-rc.1). Leave blank for the final release.
        required: false
        type: string
      dry_run:
        description: Run the validations only. Create no tag, release or ZIPs.
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main, not $REF"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.309

      - name: Work out the tag
        id: tag
        env:
          RC: ${{ inputs.release_candidate }}
        run: |
          version="$(jq -r .version plugins/clozd/.claude-plugin/plugin.json)"
          if [ -n "$RC" ]; then
            if ! [[ "$RC" =~ ^[0-9]+$ ]]; then
              echo "::error::release_candidate must be a number, got '$RC'"
              exit 1
            fi
            tag="v$version-rc.$RC"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            tag="v$version"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump the plugin version or pick another release candidate number."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Versions agree
        run: |
          node scripts/check-versions.mjs --self-test
          node scripts/check-versions.mjs
      - name: Packaging test
        run: python3 scripts/test-package-contents.py
      - name: House rules and customer copies
        run: |
          cmp LICENSE plugins/clozd/LICENSE
          cmp SECURITY.md plugins/clozd/SECURITY.md
          status=0
          for dir in plugins/clozd/skills/*/; do
            node scripts/check-skill.mjs "${dir%/}" || status=1
          done
          exit "$status"
      - name: Claude plugin validation
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/clozd

      - name: Build and inspect the ZIPs
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/build-skill-zips.py "${TAG#v}" dist
          expected_plugin='.claude-plugin/plugin.json
          LICENSE
          README.md
          SECURITY.md
          skills/analyzing-win-loss/SKILL.md
          skills/analyzing-win-loss/agents/openai.yaml
          skills/analyzing-win-loss/references/data-layers.md
          skills/analyzing-win-loss/references/filters.md
          skills/analyzing-win-loss/references/report-format.md'
          expected_skill='analyzing-win-loss/SKILL.md
          analyzing-win-loss/agents/openai.yaml
          analyzing-win-loss/references/data-layers.md
          analyzing-win-loss/references/filters.md
          analyzing-win-loss/references/report-format.md'
          diff <(printf '%s\n' "$expected_plugin" | sed 's/^ *//' | LC_ALL=C sort) <(unzip -Z1 "dist/clozd-${TAG#v}.zip" | LC_ALL=C sort)
          diff <(printf '%s\n' "$expected_skill" | sed 's/^ *//' | LC_ALL=C sort) <(unzip -Z1 "dist/analyzing-win-loss-${TAG#v}.zip" | LC_ALL=C sort)
      - name: Check SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Require eval API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::the EVAL_ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi
      - name: Stage plugin with evals
        run: |
          mkdir "$RUNNER_TEMP/eval-plugin"
          cp -R plugins/clozd/. "$RUNNER_TEMP/eval-plugin/"
          cp -R evals "$RUNNER_TEMP/eval-plugin/evals"
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
        run: >
          claude plugin eval "$RUNNER_TEMP/eval-plugin"
          --threshold 0.8
          --trust-plugin
          --max-cost-usd 5
          --model claude-sonnet-5-5
          --judge-model claude-haiku-5-5
          --json "$GITHUB_WORKSPACE/eval-results.json"
      - name: Upload eval results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
          if-no-files-found: warn

  create:
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${flags[@]}"

  publish:
    needs: [validate, create]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
