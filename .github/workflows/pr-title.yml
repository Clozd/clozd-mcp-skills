name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is type(scope) subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|chore|ci|test|build|refactor|style)(\([a-z0-9._-]+\))?!?: .+'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must look like 'type(scope): subject'. Types: feat, fix, perf, revert, docs, chore, ci, test, build, refactor, style."
            exit 1
          fi
          echo "title ok"
