name: release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload assets for
        required: true
        type: string
      ref:
        description: Commit to build from. Needed while the release is still a draft, because a draft has no git tag yet.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload assets for (re-run after a failed upload)
        required: true
        type: string

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.event.release.tag_name }}

      - name: Check tag against plugin.json
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(jq -r .version plugins/clozd/.claude-plugin/plugin.json)"
          if [[ "$TAG" != "v$version" ]]; then
            rc="${TAG#"v$version-rc."}"
            if [[ "$rc" == "$TAG" || ! "$rc" =~ ^[0-9]+$ ]]; then
              echo "error: tag $TAG does not match plugin.json version $version"
              exit 1
            fi
          fi

      - name: Build zips
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 scripts/build-skill-zips.py "${TAG#v}" dist

      - name: Upload to release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
